<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Umaiza's Puzzle World</title>
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puzzle World">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="cheer"></div>
<canvas id="fx"></canvas>
<div id="printArea"></div>
<script>
(function(){var E=['🧸','🎈','⭐','🚂','🦆','🪁','🧩','🎠','🍼','🌈','☁️','🐥','🦋','🚀','🎨','🧁','🐻','🪀','🍭','🦄'],h='';
E.forEach(function(e,i){h+='<i style="left:'+((i*37+6)%94)+'%;top:'+((i*53+4)%86)+'%;font-size:'+(26+(i*7)%34)+'px;animation-delay:-'+((i*1.3)%9)+'s;animation-duration:'+(9+(i%5)*2)+'s">'+e+'</i>';});
document.getElementById('bg').innerHTML=h;})();
</script>
<script src="js/puzzles.js"></script>
<script src="js/puzzles2.js"></script>
<script src="js/certs.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
